name: Build Soko Chat for Windows

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install app and packager
        run: python -m pip install -r client/requirements.txt pyinstaller
      - name: Set hosted API as the app default
        shell: pwsh
        run: |
          $api = "https://soko-chat-api.onrender.com"
          @"
          DEFAULT_API = `"$api`"
          "@ | Set-Content -Encoding utf8 client/deployment_defaults.py
      - name: Package desktop app
        run: pyinstaller --noconfirm --clean --windowed --name SokoChat --paths . --collect-all PySide6 --hidden-import keyring.backends.Windows client/main.py
      - name: Create download archive
        run: Compress-Archive -Path dist/SokoChat/* -DestinationPath dist/SokoChat-Windows.zip
      - name: Publish beta download
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $beta = gh release list --json tagName --jq '.[] | select(.tagName == "beta") | .tagName'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($beta) {
            gh release upload beta dist/SokoChat-Windows.zip --clobber
          } else {
            gh release create beta dist/SokoChat-Windows.zip --title "Soko Chat beta" --notes "Wersja beta Soko Chat na Windows. Mogą występować błędy." --prerelease
          }
      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release create "$GITHUB_REF_NAME" dist/SokoChat-Windows.zip --title "Soko Chat $GITHUB_REF_NAME" --generate-notes
      - name: Save build artifact
        if: startsWith(github.ref, 'refs/heads/')
        uses: actions/upload-artifact@v4
        with:
          name: SokoChat-Windows
          path: dist/SokoChat-Windows.zip
